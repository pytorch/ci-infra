name: "OSDC: Plan (prod)"

on:
  pull_request:
    # Must list every file `just plan` or its tofu reads, plus these workflows.
    paths:
      - "osdc/**/terraform/**"
      - "osdc/base/scripts/bootstrap/**"
      - "osdc/clusters.yaml"
      - "osdc/justfile"
      - "osdc/.env"
      - ".env"
      - "osdc/mise.*"
      - "osdc/scripts/cluster-config.py"
      - "osdc/scripts/mise-activate.sh"
      - "osdc/scripts/state-config.sh"
      - ".github/workflows/osdc-plan-prod.yml"
      - ".github/workflows/_osdc-plan.yml"
      - ".github/workflows/_osdc-deploy.yml"

concurrency:
  group: osdc-plan-prod-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan_ue2:
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/_osdc-plan.yml
    with:
      cluster: meta-prod-aws-ue2
      pr_number: ${{ github.event.pull_request.number }}
    secrets: inherit

  plan_uw1:
    needs: plan_ue2
    if: |
      !cancelled() &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/_osdc-plan.yml
    with:
      cluster: meta-prod-aws-uw1
      pr_number: ${{ github.event.pull_request.number }}
    secrets: inherit

  plan_ue1:
    needs: plan_uw1
    if: |
      !cancelled() &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/_osdc-plan.yml
    with:
      cluster: meta-prod-aws-ue1
      pr_number: ${{ github.event.pull_request.number }}
    secrets: inherit

  plan_uw2:
    needs: plan_ue1
    if: |
      !cancelled() &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/_osdc-plan.yml
    with:
      cluster: meta-prod-aws-uw2
      pr_number: ${{ github.event.pull_request.number }}
    secrets: inherit

  plan_lf_ue1:
    needs: plan_uw2
    if: |
      !cancelled() &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/_osdc-plan.yml
    with:
      cluster: lf-prod-aws-ue1
      use_lf_credentials: true
      pr_number: ${{ github.event.pull_request.number }}
    secrets: inherit

  plan_lf_ue2:
    needs: plan_lf_ue1
    if: |
      !cancelled() &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/_osdc-plan.yml
    with:
      cluster: lf-prod-aws-ue2
      use_lf_credentials: true
      pr_number: ${{ github.event.pull_request.number }}
    secrets: inherit
