name: "gpu-dev: Publish to PyPI"

on:
  push:
    tags:
      - "gpu-dev/v*"
  # Self-test the release path on PRs.
  pull_request:
    paths:
      - ".github/workflows/gpu-dev-publish.yml"
      - "gpu-dev/pyproject.toml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check only; skip the PyPI upload"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: gpu-dev-publish-${{ github.ref }}
  # Never cancel a release.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

defaults:
  run:
    working-directory: gpu-dev

jobs:
  # No credentials; runs on every trigger.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history for the on-main check.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Require the tag to be on main
        if: github.ref_type == 'tag'
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main; refusing to publish"
            exit 1
          fi

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        run: |
          PKG_VERSION=$(python3 -c \
            "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG_VERSION=${GITHUB_REF#refs/tags/gpu-dev/v}
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) != gpu-dev/pyproject.toml ($PKG_VERSION)"
            exit 1
          fi

      - name: Refuse to re-publish an existing version
        if: github.ref_type == 'tag'
        run: |
          V=${GITHUB_REF#refs/tags/gpu-dev/v}
          # `|| CODE=000`: the default shell is `bash -e`, which would abort on a
          # curl transport failure before the warn branch below could run.
          CODE=$(curl -sS --max-time 20 --retry 3 -o /dev/null \
            -w '%{http_code}' "https://pypi.org/pypi/gpu-dev/$V/json") || CODE=000
          case "$CODE" in
            404) echo "gpu-dev $V is not on PyPI yet" ;;
            200) echo "::error::gpu-dev $V is already on PyPI and versions are immutable; bump and re-tag"
                 exit 1 ;;
            *)   echo "::warning::PyPI returned $CODE; skipping the duplicate-version check" ;;
          esac

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.13"

      - name: Build package (gpu-dev = CLI + SDK)
        run: uv build

      - name: Summarise artifacts
        run: |
          {
            echo "### gpu-dev build"
            echo
            echo '```'
            find dist -maxdepth 1 -type f -printf '%10s  %f\n'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # upload-artifact does not honour defaults.run.working-directory.
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gpu-dev-dist
          path: gpu-dev/dist/
          if-no-files-found: error

  # Credentialed job: download -> attest -> upload, no checkout.
  publish:
    needs: build
    if: github.ref_type == 'tag' && inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pypi
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gpu-dev-dist
          path: dist

      - name: Generate attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          # Re-run safety; build already fails on a true duplicate.
          skip-existing: true
