name: "EBS janitor"

# Deletes or backs up detached EBS volumes in the Meta (fbossci) and LF fleet
# accounts. See ebs-janitor/README.md.

# yamllint disable-line rule:truthy
on:
  pull_request:
    paths:
      - "ebs-janitor/**"
      - ".github/workflows/ebs-janitor.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ebs-janitor
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv run --no-project --with-requirements requirements.txt pytest -q
