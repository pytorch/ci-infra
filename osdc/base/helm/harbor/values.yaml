# Harbor Pull-Through Cache - Base Values
# Install with: helm install harbor harbor/harbor --version 1.18.2

# ============================================================================
# Image overrides: each component's image.repository is overridden via --set
# in the deploy-harbor justfile recipe to pull from ECR mirrors.
# The chart has no global.imageRegistry; each component must be set individually.
# ============================================================================

# ============================================================================
# YAML Anchors for shared configuration
# ============================================================================
x-base-tolerations: &base-tolerations
  - key: CriticalAddonsOnly
    operator: Equal
    value: "true"
    effect: NoSchedule

x-base-affinity: &base-affinity
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: role
              operator: In
              values:
                - base-infrastructure

# Hard node selector for components with topologySpreadConstraints below.
# x-base-affinity above is only a soft preference, so without this the
# topology-spread skew calculation treats every node in the cluster as a
# valid (zero-count) domain, not just the 4 base-infrastructure nodes.
# That makes maxSkew: 1 mathematically unsatisfiable as soon as a
# component's replica count exceeds the base node count — any node
# already holding one same-generation pod would need a 2nd, giving
# skew = 2 against an empty domain elsewhere, which always exceeds
# maxSkew: 1 regardless of matchLabelKeys. core/portal happened to pass
# because their replica count equals the node count exactly (4 == 4);
# nginx at 6 replicas over 4 nodes deadlocked permanently. Restricting
# the node set here matches the same pattern already used in
# modules/bin-pack-scheduler/kubernetes/base/deployment.yaml.
x-base-node-selector: &base-node-selector
  role: base-infrastructure

# Hard-spread each component's replicas one-per-node. Without this, a
# rolling base node replacement (nodes become Ready one at a time) can pile
# every replica of core/registry/etc. onto whichever node comes up first,
# starving other pods on that node of CPU — including harbor-database,
# whose EBS volume pins it to one specific AZ/node. Component name is
# templated in per-component below since each has a distinct label.
#
# matchLabelKeys: [pod-template-hash] scopes the skew calculation to the
# current ReplicaSet generation only. Without it, a Deployment rollout
# deadlocks whenever replicas > node count: the constraint counts old- and
# new-generation pods together (both share the same component label), so
# leftover old pods on a node block new pods from ever satisfying maxSkew,
# and whenUnsatisfiable: DoNotSchedule refuses to place them — the rollout
# can't finish because new pods never go Ready, and old pods can't be
# removed until new ones do.
x-spread-template: &spread-template
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: DoNotSchedule
  matchLabelKeys:
    - pod-template-hash

# ============================================================================
# Expose configuration (NodePort for containerd access)
# ============================================================================
expose:
  type: nodePort
  nodePort:
    ports:
      http:
        port: 80
        nodePort: 30002
  tls:
    enabled: false

externalURL: http://harbor:30002

# ============================================================================
# Persistence (S3 for registry, EBS for database/redis)
# ============================================================================
persistence:
  enabled: true
  imageChartStorage:
    type: s3
    s3:
      # bucket/region overridden per environment
      bucket: ""
      region: ""
      # S3 redirect mode: clients pull layers directly from S3,
      # offloading bandwidth from Harbor registry pods
      disableredirect: false
  persistentVolumeClaim:
    database:
      storageClass: gp3
      size: 10Gi
    redis:
      storageClass: gp3
      size: 5Gi

# ============================================================================
# Component configuration
# ============================================================================

# Disable Trivy scanner (cache-only deployment, no scanning needed)
trivy:
  enabled: false

# Enable Harbor's built-in cache
cache:
  enabled: true
  expireHours: 24

# ============================================================================
# Component tolerations and affinity (run on base infrastructure nodes)
# ============================================================================
core:
  tolerations: *base-tolerations
  affinity: *base-affinity
  nodeSelector: *base-node-selector
  topologySpreadConstraints:
    - <<: *spread-template
      labelSelector:
        matchLabels: {app: harbor, component: core}

# registry and jobservice are NOT given topologySpreadConstraints: both use
# an RWO PVC (see updateStrategy note below), so their replicas are already
# constrained to land together on whatever node holds that volume — a hard
# per-node spread would conflict with that and leave pods Pending.
registry:
  tolerations: *base-tolerations
  affinity: *base-affinity

jobservice:
  tolerations: *base-tolerations
  affinity: *base-affinity

# Recreate strategy for Deployments with RWO PVCs (jobservice + registry).
# RollingUpdate causes Multi-Attach errors when old and new pods land on
# different nodes — EBS volumes can only attach to one node at a time.
# This is a global chart value (used by jobservice-dpl.yaml and registry-dpl.yaml).
updateStrategy:
  type: Recreate

portal:
  tolerations: *base-tolerations
  affinity: *base-affinity
  nodeSelector: *base-node-selector
  topologySpreadConstraints:
    - <<: *spread-template
      labelSelector:
        matchLabels: {app: harbor, component: portal}

nginx:
  replicas: 3
  resources:
    requests:
      cpu: "500m"
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 1Gi
  tolerations: *base-tolerations
  affinity: *base-affinity
  nodeSelector: *base-node-selector
  topologySpreadConstraints:
    - <<: *spread-template
      labelSelector:
        matchLabels: {app: harbor, component: nginx}

database:
  internal:
    # password is set at deploy time via --set database.internal.password=...
    # (auto-generated and stored in K8s secret harbor-db-password)
    resources:
      requests:
        cpu: "1"
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 2Gi
    tolerations: *base-tolerations
    affinity: *base-affinity

redis:
  internal:
    tolerations: *base-tolerations
    affinity: *base-affinity

exporter:
  tolerations: *base-tolerations
  affinity: *base-affinity

# ============================================================================
# Metrics (for future Prometheus scraping)
# ============================================================================
metrics:
  enabled: true

# ============================================================================
# Harbor admin password
# ============================================================================
# The admin password is auto-generated at deploy time by the deploy-harbor
# recipe and passed via --set harborAdminPassword=... on the helm command line.
# Do NOT hardcode a password here.
