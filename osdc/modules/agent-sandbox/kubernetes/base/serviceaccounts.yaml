# Service accounts for the sandbox.
#
#   sandbox-agent : the untrusted agent pod. NO Role/RoleBinding — zero K8s perms,
#                   and (by design) no cloud credentials of any kind. Token
#                   automount is force-disabled so a compromised agent cannot
#                   reach the K8s API even if it finds a mounted token.
#   sigv4-proxy   : carries the IRSA role ARN (terraform output, substituted by
#                   deploy.sh) so it can sign Bedrock requests. Read-only IAM.
#                   Automount left at default — IRSA's projected token is what it
#                   uses; the SA follows the hf-cache-mount convention.
#
# The role ARN is substituted here rather than annotated after apply. An imperative
# annotate lands after the proxy pods have been admitted, so on a first deploy they
# can pass their tcpSocket readiness probe with no token injected and sign with
# nothing — while the worker has no retry. It also forced a rollout restart on every
# deploy, which defeated the point of kubectl_apply_if_changed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-agent
  namespace: ai-sandbox
  labels:
    osdc.io/module: agent-sandbox
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sigv4-proxy
  namespace: ai-sandbox
  labels:
    osdc.io/module: agent-sandbox
  annotations:
    eks.amazonaws.com/role-arn: "__SIGV4_ROLE_ARN__"
