# Service accounts for the sandbox.
#
#   sandbox-agent : the untrusted agent pod. NO Role/RoleBinding — zero K8s perms,
#                   and (by design) no cloud credentials of any kind. Token
#                   automount is force-disabled so a compromised agent cannot
#                   reach the K8s API even if it finds a mounted token.
#   sigv4-proxy   : annotated at deploy time with the IRSA role ARN (terraform
#                   output) so it can sign Bedrock/AWS requests. Read-only IAM.
#                   Automount left at default — IRSA's projected token is what it
#                   uses; the SA follows the hf-cache-mount convention.
#   agent-vault   : the header-injection proxy. No cloud identity; its secrets
#                   come from the agent-sandbox-creds K8s Secret (env-injected).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-agent
  namespace: ai-sandbox
  labels:
    osdc.io/module: agent-sandbox
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sigv4-proxy
  namespace: ai-sandbox
  labels:
    osdc.io/module: agent-sandbox
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-vault
  namespace: ai-sandbox
  labels:
    osdc.io/module: agent-sandbox
automountServiceAccountToken: false
