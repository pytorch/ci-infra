# The dispatcher's Kubernetes permissions — the trust shift this design introduces.
#
# Namespaced to ai-sandbox (never a ClusterRole), and narrower than "create pods": the
# dispatcher creates SandboxClaims, which can only name the sandbox-task pool and an
# expiry (admissionpolicy.yaml), so the pod spec is the template's, not the dispatcher's.
# The agent-sandbox controller creates the pod. Task pods keep the sandbox-agent SA,
# which has no RBAC at all and no token mounted, so nothing the untrusted side runs can
# reach the API server.
#
# No pod access at all: the task's result comes back on the sandboxd call, not through
# the pod's log.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-dispatcher
  namespace: ai-sandbox
  labels:
    osdc.io/module: agent-sandbox

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-dispatcher
  namespace: ai-sandbox
  labels:
    osdc.io/module: agent-sandbox
# Every verb here maps to exactly one call the dispatcher makes; nothing is granted for
# symmetry. No `list` — it only ever addresses the claim it created, by name. No `watch`
# anywhere — it polls.
rules:
  # POST .../sandboxclaims, GET and DELETE .../sandboxclaims/sandbox-task-<id>
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims"]
    verbs: ["create", "get", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-dispatcher
  namespace: ai-sandbox
  labels:
    osdc.io/module: agent-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sandbox-dispatcher
subjects:
  - kind: ServiceAccount
    name: sandbox-dispatcher
    namespace: ai-sandbox
