# Header-injection egress proxy (mitmproxy). Named "agent-vault" for Service/label
# stability, but implemented with mitmproxy + a tiny addon — the Infisical Agent
# Vault image turned out to be a stateful server, not a config-file injector, so
# we use the mature, self-owned option instead.
#
# TLS-MITM forward proxy: the agent sets HTTPS_PROXY to this Service and trusts
# the proxy CA (agent-vault-ca); the addon injects the read-only GitHub token
# (held here, never in the agent) on the wire, and default-denies any host not on
# the allowlist. Runs on base infra nodes (tolerates CriticalAddonsOnly), NOT on
# the sandbox fleet — the credential never shares a node/gVisor sandbox with agent
# code.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-vault-config
  namespace: ai-sandbox
  labels:
    osdc.io/module: agent-sandbox
data:
  inject.py: |
    """mitmproxy addon: default-deny egress + inject the GitHub token on the wire.

    The agent never sees GITHUB_TOKEN — it makes a plain request and this addon
    attaches the credential for allow-listed hosts. Any other host is refused.

    Auth scheme differs by endpoint: git-over-HTTPS (github.com, codeload) uses
    Basic (x-access-token:<token>), while the REST API (api.github.com) uses
    Bearer. Injecting Bearer at the git endpoints yields a 401 -> git prompts for
    a username -> "could not read Username" failure.
    """
    import base64
    import os

    from mitmproxy import http

    _TOKEN = os.environ.get("GITHUB_TOKEN", "")
    _GIT_HOSTS = {"github.com", "codeload.github.com"}
    _API_HOSTS = {"api.github.com"}
    _ALLOWED = _GIT_HOSTS | _API_HOSTS


    def request(flow: http.HTTPFlow) -> None:
        host = flow.request.pretty_host
        if host not in _ALLOWED:
            flow.response = http.Response.make(403, b"host not allowed by sandbox proxy\n")
            return
        if not _TOKEN:
            return
        if host in _API_HOSTS:
            flow.request.headers["Authorization"] = f"Bearer {_TOKEN}"
        else:
            basic = base64.b64encode(f"x-access-token:{_TOKEN}".encode()).decode()
            flow.request.headers["Authorization"] = f"Basic {basic}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-vault
  namespace: ai-sandbox
  labels:
    osdc.io/module: agent-sandbox
    app: agent-vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-vault
  template:
    metadata:
      labels:
        app: agent-vault
        osdc.io/module: agent-sandbox
    spec:
      serviceAccountName: agent-vault
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # fsGroup makes the /certs emptyDir group-writable so mitmproxy (uid 1000)
        # can use the CA the init container writes there.
        fsGroup: 1000
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
          effect: NoSchedule
      initContainers:
        # mitmproxy expects a single PEM (key + cert) at <confdir>/mitmproxy-ca.pem.
        # Build it from the operator-provided CA secret.
        - name: build-ca
          # TODO(prototype): pin by digest.
          image: mitmproxy/mitmproxy:latest
          command: ["sh", "-c", "cat /ca/ca.key /ca/ca.crt > /certs/mitmproxy-ca.pem"]
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: ca
              mountPath: /ca
              readOnly: true
            - name: certs
              mountPath: /certs
      containers:
        - name: mitmproxy
          # TODO(prototype): pin by digest.
          image: mitmproxy/mitmproxy:latest
          command:
            - mitmdump
            # OSDC EKS is IPv6-only — bind :: so the Service target (IPv6) is reachable.
            - --listen-host
            - "::"
            - --listen-port
            - "14322"
            - --set
            - confdir=/certs
            # Pods have public (global) IPv6 source addresses; without this
            # mitmproxy refuses them as non-local clients.
            - --set
            - block_global=false
            - -s
            - /addons/inject.py
          ports:
            - name: proxy
              containerPort: 14322
          env:
            # Real credential lives here, injected from the K8s Secret. The agent
            # never receives it — it only sends a request the proxy authenticates.
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agent-sandbox-creds
                  key: github-token
          volumeMounts:
            - name: addon
              mountPath: /addons
              readOnly: true
            - name: certs
              mountPath: /certs
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: addon
          configMap:
            name: agent-vault-config
        - name: ca
          secret:
            # Pre-generated MITM CA (ca.crt + ca.key). Created out-of-band; the
            # agent trusts ca.crt. See README.
            secretName: agent-vault-ca
        - name: certs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: agent-vault
  namespace: ai-sandbox
  labels:
    osdc.io/module: agent-sandbox
    app: agent-vault
spec:
  selector:
    app: agent-vault
  ports:
    - name: proxy
      port: 14322
      targetPort: proxy
