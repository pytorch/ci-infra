# The dispatcher: what callers address, and the only thing here that can create pods.
#
# One Job per /run, so tasks run in parallel and each gets a fresh pod. Parallelism
# comes from Karpenter — a pending task pod adds an ai-sandbox node — rather than from
# replica count plus a connection-aware load balancer.
#
# This is the TRUSTED side. It runs on base nodes (no runtimeClassName, CriticalAddonsOnly
# toleration like sigv4-proxy), not on the sandbox fleet: it holds RBAC to create Jobs,
# so it must not share nodes with the untrusted work it launches. It never clones and
# never prompts a model — those only ever happen inside a task pod.
#
# __DISPATCHER_IMAGE__ / __AGENT_IMAGE__ / __AWS_REGION__ / __BEDROCK_DEFAULT_MODEL_ID__
# are substituted by deploy.sh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-dispatcher
  namespace: ai-sandbox
  labels:
    osdc.io/module: agent-sandbox
    app: sandbox-dispatcher
spec:
  # Two, so a rolling update doesn't take the entry point away. MAX_CONCURRENT_TASKS is
  # per replica (2 x 6 = 12), which is what the namespace ResourceQuota is sized for.
  replicas: 2
  selector:
    matchLabels:
      app: sandbox-dispatcher
  template:
    metadata:
      labels:
        app: sandbox-dispatcher
        osdc.io/module: agent-sandbox
    spec:
      serviceAccountName: sandbox-dispatcher
      affinity:
        # State the security property directly rather than leaning on the absence of a
        # runtimeClassName: this pod can create Jobs, so it must never sit on a node
        # running sandboxes, where a gVisor escape would land on its projected token.
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-fleet
                    operator: NotIn
                    values: ["ai-sandbox"]
        # One replica per node, or "HA" is two pods a single drain can take out
        # together. matchLabelKeys scopes this to the current ReplicaSet generation, so a
        # rollout isn't blocked by old pods still terminating — same pattern as
        # sigv4-proxy and modules/bin-pack-scheduler.
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: sandbox-dispatcher
              matchLabelKeys:
                - pod-template-hash
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
          effect: NoSchedule
      containers:
        - name: dispatcher
          # Content-hash tag from deploy.sh — immutable, so the default IfNotPresent
          # pull policy is correct.
          image: __DISPATCHER_IMAGE__
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # The task image this dispatcher launches. Same content-hash tag deploy.sh
            # just built and pushed.
            - name: AGENT_IMAGE
              value: __AGENT_IMAGE__
            - name: AWS_REGION
              value: "__AWS_REGION__"
            - name: BEDROCK_DEFAULT_MODEL_ID
              value: "__BEDROCK_DEFAULT_MODEL_ID__"
            - name: SIGV4_PROXY
              value: "sigv4-proxy.ai-sandbox.svc.cluster.local:8080"
            - name: MAX_CONCURRENT_TASKS
              value: "6"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
          # Small: it waits on the API server, it does no work of its own. The
          # namespace ResourceQuota counts these, so they are sized to leave the task
          # slots intact.
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "500m"
              memory: "512Mi"
              ephemeral-storage: "1Gi"

---
# Kept named sandbox-agent: it is the address arc-runners and the canary already use
# (sandbox-agent.ai-sandbox.svc.cluster.local:8080). The selector now points at the
# dispatcher, which answers /run in its place.
apiVersion: v1
kind: Service
metadata:
  name: sandbox-agent
  namespace: ai-sandbox
  labels:
    osdc.io/module: agent-sandbox
    app: sandbox-dispatcher
spec:
  type: ClusterIP
  selector:
    app: sandbox-dispatcher
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http

---
# PDB so a node drain can't take both replicas at once and leave callers with no entry
# point. Same shape and reasoning as proxy-pdb.yaml.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sandbox-dispatcher
  namespace: ai-sandbox
  labels:
    osdc.io/module: agent-sandbox
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: sandbox-dispatcher
