# Agent-sandbox Kubernetes resources (namespace-scoped + the cluster-scoped gvisor
# RuntimeClass). deploy.sh substitutes __DISPATCHER_IMAGE__ / __AGENT_IMAGE__ /
# __AWS_REGION__ / __BEDROCK_DEFAULT_MODEL_ID__ / __SIGV4_ROLE_ARN__ / __K8S_API_CIDR__
# across this output at apply time (kustomize can read neither clusters.yaml, terraform
# outputs, nor the cluster's own Service CIDR).
#
# There is no Deployment for the sandbox itself: the dispatcher creates one Job per
# request, so task pods exist only while a task runs. The Job template lives in
# dispatcher/kube.py rather than here — it is built per request from the task image tag
# deploy.sh substituted above. admissionpolicy.yaml is the cluster-side check on what
# that template is allowed to contain.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - runtimeclass.yaml
  - serviceaccounts.yaml
  - rbac.yaml
  - admissionpolicy.yaml
  - oidc.yaml
  - quota.yaml
  - sigv4-proxy.yaml
  - proxy-pdb.yaml
  - dispatcher.yaml
  - networkpolicy.yaml

# Capability manifests (see dispatcher/manifest.py). The name hash suffix rolls the
# dispatcher whenever a manifest changes, since it loads them once at startup. Every file
# in capabilities/ must be listed here; test_manifest.py fails if one is missing.
configMapGenerator:
  - name: agent-capabilities
    namespace: ai-sandbox
    options:
      labels:
        osdc.io/module: agent-sandbox
    files:
      - capabilities/ciforge-experiments.yaml
      - capabilities/ciforge-pr-review.yaml
      - capabilities/osdc-integration-test.yaml
