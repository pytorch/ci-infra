# aws-sigv4-proxy (AWS-maintained) — signs the agent's plain HTTP requests with
# SigV4 using this pod's IRSA identity, then forwards them upstream over HTTPS.
# Covers all AWS, including Bedrock (bedrock-runtime InvokeModel). The agent
# sends UNSIGNED requests here with the target AWS host in the Host header; the
# proxy infers the service and signs. The agent never holds AWS credentials —
# IRSA STS creds live only in this trusted proxy and auto-rotate.
#
# Runs on base infra nodes (tolerates CriticalAddonsOnly), off the sandbox fleet.
# The SA is annotated with the read-only IRSA role ARN at deploy time (deploy.sh
# reads the terraform output).
#
# PROTOTYPE — VERIFY BEFORE DEPLOY:
#   * Image tag: pin aws-sigv4-proxy by digest.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sigv4-proxy
  namespace: ai-sandbox
  labels:
    osdc.io/module: agent-sandbox
    app: sigv4-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sigv4-proxy
  template:
    metadata:
      labels:
        app: sigv4-proxy
        osdc.io/module: agent-sandbox
    spec:
      serviceAccountName: sigv4-proxy
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
          effect: NoSchedule
      containers:
        - name: sigv4-proxy
          # TODO(prototype): pin by digest.
          image: public.ecr.aws/aws-observability/aws-sigv4-proxy:latest
          args:
            # No --name: the target service/host comes from each request's Host
            # header, so one proxy serves bedrock-runtime, cloudwatch, logs, etc.
            - --verbose
            - --log-failed-requests
            - --port
            - ":8080"
          ports:
            - name: proxy
              containerPort: 8080
          securityContext:
            runAsNonRoot: true
            runAsUser: 2000
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: sigv4-proxy
  namespace: ai-sandbox
  labels:
    osdc.io/module: agent-sandbox
    app: sigv4-proxy
spec:
  selector:
    app: sigv4-proxy
  ports:
    - name: proxy
      port: 8080
      targetPort: proxy
