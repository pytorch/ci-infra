# Automatic PR review, developed in pytorch/ciforge. PR-triggered clients are allowed:
# the manifest bounds what the run may do, so the client need not be trusted.
# workflow_run covers the split pattern (an untrusted capture stage, then a
# default-branch stage that calls the dispatcher).
name: ciforge-pr-review
owner: pytorch-dev-infra
clients:
  repos:
    - repository: pytorch/ciforge
      repository_id: "1133856973"
      repository_owner_id: "21003710"
  triggers: [pull_request, workflow_run, workflow_dispatch]
model:
  id: us.anthropic.claude-opus-5-5
sandbox:
  # Public repos only: the task pod clones anonymously and holds no credential.
  repos: [pytorch/pytorch, pytorch/test-infra, pytorch/ci-infra]
capabilities:
  # Writes the run may PROPOSE. The dispatcher screens proposals against this and the
  # action's apply step performs them with the calling job's token, only while the pull
  # request still points at the commit the agent read. Advisory only: a neutral check.
  # The callers run in pytorch/ciforge and the targets are other repositories, so the
  # apply step needs a `github-token` for the target; the ciforge job token cannot write
  # there, and the action refuses to try.
  effects:
    - effect: pr_comment
    - effect: check_run
      name: ai-review
      conclusions: [neutral]
