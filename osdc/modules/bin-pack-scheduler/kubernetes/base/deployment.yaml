# bin-pack-scheduler: a stock kube-scheduler run as a secondary scheduler.
# Image tracks eks_version (clusters.yaml); a guard test enforces the minor
# matches. ±1 minor skew is tolerated, so bump on EKS upgrade.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bin-pack-scheduler
  namespace: kube-system
  labels:
    osdc.io/module: bin-pack-scheduler
    app: bin-pack-scheduler
spec:
  replicas: 3  # default; set per-cluster by deploy.sh. HA via leader election (only one active).
  selector:
    matchLabels:
      app: bin-pack-scheduler
  template:
    metadata:
      labels:
        app: bin-pack-scheduler
        osdc.io/module: bin-pack-scheduler
    spec:
      serviceAccountName: bin-pack-scheduler
      priorityClassName: system-cluster-critical
      # Run on stable infra nodes, not ephemeral runner/workflow nodes.
      nodeSelector:
        role: base-infrastructure
      tolerations:
        - key: CriticalAddonsOnly
          operator: Equal
          value: "true"
          effect: NoSchedule
      # Hard-spread replicas one-per-node. A "preferred" anti-affinity here
      # let all replicas land on the same base node during a rolling node
      # replacement (nodes become Ready one at a time, so early pods pile
      # onto whichever node is up first) — that starved other pods on that
      # node of CPU. maxUnavailable on the base node group never exceeds
      # replicas-1 nodes, so a required constraint can't wedge this pending.
      #
      # matchLabelKeys: [pod-template-hash] scopes the anti-affinity to the
      # current ReplicaSet generation only, so a Deployment rollout doesn't
      # count old-generation pods still awaiting termination against new
      # pods' placement — replicas currently sit under node count so this
      # hasn't deadlocked yet, but see base/helm/harbor/values.yaml for the
      # rollout deadlock this avoids once that margin disappears.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: bin-pack-scheduler
              matchLabelKeys:
                - pod-template-hash
      containers:
        - name: kube-scheduler
          image: registry.k8s.io/kube-scheduler:v1.35.0
          command:
            - kube-scheduler
            - --config=/etc/kubernetes/bin-pack-scheduler/config.yaml
            - --v=2
          ports:
            - name: https
              containerPort: 10259
              protocol: TCP
          resources:
            requests: {cpu: 3, memory: 6Gi}
            limits: {cpu: 3, memory: 6Gi}
          livenessProbe:
            httpGet: {path: /healthz, port: 10259, scheme: HTTPS}
            initialDelaySeconds: 15
          readinessProbe:
            httpGet: {path: /readyz, port: 10259, scheme: HTTPS}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
          volumeMounts:
            - name: config
              mountPath: /etc/kubernetes/bin-pack-scheduler
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: bin-pack-scheduler-config  # kustomize rewrites to the hashed name
