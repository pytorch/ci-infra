# ARC runner definition: l-x86iamx-44-450-h100-fab-2 (2x NVIDIA H100)
# Scheduled on NodePool: p5-48xlarge (from nodepools-h100 module)
runner:
  name: l-x86iamx-44-450-h100-fab-2
  instance_type: p5.48xlarge
  disk_size: 200
  vcpu: 44
  memory: 450Gi
  gpu: 2
  imex_channels: 0
  # Fixed-capacity cap: 1 reserved 8-GPU node / 2 GPUs per runner = 4 concurrent runners.
  # Per-cluster overrides scale this to the cluster's reserved node count
  # (clusters.<id>.nodepools-h100.capacity_reservation_ids).
  max_runners:
    default: 4
    meta-prod-aws-uw1: 24
    meta-prod-aws-ue2: 16
