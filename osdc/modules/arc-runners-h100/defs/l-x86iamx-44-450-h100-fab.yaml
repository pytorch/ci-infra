# ARC runner definition: l-x86iamx-44-450-h100-fab (2x NVIDIA H100, IMEX fabric)
# Scheduled on NodePool: p5-48xlarge (from nodepools-h100 module)
runner:
  name: l-x86iamx-44-450-h100-fab
  instance_type: p5.48xlarge
  disk_size: 200
  vcpu: 44
  memory: 450Gi
  gpu: 2
  imex_channels: 0
  # Dedicated fabric runner: fixed low cap, not scaled to the full reservation.
  max_runners: 1
