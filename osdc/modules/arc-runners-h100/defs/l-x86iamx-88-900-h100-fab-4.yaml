# ARC runner definition: l-x86iamx-88-900-h100-fab-4 (4x NVIDIA H100)
# Scheduled on NodePool: p5-48xlarge (from nodepools-h100 module)
runner:
  name: l-x86iamx-88-900-h100-fab-4
  instance_type: p5.48xlarge
  disk_size: 200
  vcpu: 88
  memory: 900Gi
  gpu: 4
  imex_channels: 0
  # Fixed-capacity cap: (reserved 8-GPU nodes in the cluster × 8) / 4 GPUs per runner.
  max_runners:
    default: 2
    meta-prod-aws-ue2: 8
