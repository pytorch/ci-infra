# CUDA fabric-handle IPC validation Pod for the H100 fabric runner rollout.
#
# This is a manual, run-to-completion validation probe. It is NOT part of any
# module deploy and is NOT wired into `just`. Apply it by hand on the target
# cluster (meta-prod-aws-uw1), read the logs for the PASS/FAIL verdict, then
# delete it. See README.md in this directory.
#
# The probe source (fabric_probe.py) is mounted from a ConfigMap so it lives in
# exactly one place. Create the ConfigMap from the .py file before applying:
#
#   kubectl create configmap fabric-probe -n default \
#     --from-file=fabric_probe.py=modules/arc-runners-h100/validation/fabric_probe.py
#   kubectl apply -f modules/arc-runners-h100/validation/fabric-validation-pod.yaml
#   kubectl logs -f pod/fabric-validation -n default
#   kubectl delete pod/fabric-validation configmap/fabric-probe -n default
#
# IMAGE: set spec.containers[].image to the torch/CUDA build under validation.
# It MUST contain the c10 expandable-segments fabric IPC code and be built with
# CUDA >= 12.4. Prefer the exact image the H100 CI jobs run. If the build lacks
# the code the probe reports an inconclusive FAIL (no share log) rather than a
# false pass. See README.md.
apiVersion: v1
kind: Pod
metadata:
  name: fabric-validation
  namespace: default
  labels:
    osdc.io/module: arc-runners-h100
    osdc.io/purpose: fabric-ipc-validation
  annotations:
    # Never let Karpenter disrupt the node mid-probe.
    karpenter.sh/do-not-disrupt: "true"
spec:
  restartPolicy: Never
  # Pin to the p5.48xlarge H100 fleet (the fabric runner's node type).
  nodeSelector:
    node.kubernetes.io/instance-type: p5.48xlarge
  # Tolerate every taint an H100 workflow node can carry so the probe schedules
  # exactly where the fabric runner's job pods do.
  tolerations:
    - key: node-fleet
      operator: Exists
      effect: NoSchedule
    - key: instance-type
      operator: Exists
      effect: NoSchedule
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
    - key: git-cache-not-ready
      operator: Exists
      effect: NoSchedule
  containers:
    - name: fabric-probe
      # REPLACE with the torch/CUDA image under validation (see header + README).
      image: REPLACE_WITH_TORCH_CUDA_IMAGE
      command: ["python", "/probe/fabric_probe.py"]
      env:
        # Expose IMEX channel 0 to the container so cuMem*ShareableHandle with
        # CU_MEM_HANDLE_TYPE_FABRIC can succeed. Without this the allocator
        # silently falls back to POSIX fd and the probe fails.
        - name: NVIDIA_IMEX_CHANNELS
          value: "0"
        # Drive the c10 allocator down the expandable-segments IPC path and turn
        # on the C++ INFO logs the probe asserts against. Leave the handle type
        # UNSPECIFIED so the auto-detect / fallback path is what gets validated.
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: "expandable_segments:True"
        - name: TORCH_CUDA_EXPANDABLE_SEGMENTS_IPC
          value: "1"
        - name: TORCH_CPP_LOG_LEVEL
          value: "INFO"
        - name: GLOG_logtostderr
          value: "1"
      resources:
        requests:
          cpu: "4"
          memory: 32Gi
          nvidia.com/gpu: "2"
        limits:
          cpu: "4"
          memory: 32Gi
          nvidia.com/gpu: "2"
      volumeMounts:
        - name: probe
          mountPath: /probe
          readOnly: true
        # NCCL/torch multiprocessing want more than the default 64Mi /dev/shm.
        - name: dshm
          mountPath: /dev/shm
  volumes:
    - name: probe
      configMap:
        name: fabric-probe
        items:
          - key: fabric_probe.py
            path: fabric_probe.py
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 2Gi
