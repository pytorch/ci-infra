# Karpenter NodePool fleet: arm64-runner — dedicated pool for the ARC runner pods (and their
# placeholders) of arm64 runners. x86 runners' runner pods use the c7i-runner pool instead, so
# the runner agent reports the same architecture as the job (runner.arch / RUNNER_ARCH).
# The node-fleet=arm64-runner taint is load-bearing: runner.yaml.tpl and hooks-warmer key on it.
fleet:
  name: arm64-runner
  arch: arm64
  gpu: false
  instances:
    - type: m7g.12xlarge
      weight: 100
      node_disk_size: 1350
    - type: m7g.8xlarge
      weight: 80
      node_disk_size: 650
    - type: m8g.12xlarge
      weight: 60
      node_disk_size: 1350
    - type: m8g.8xlarge
      weight: 40
      node_disk_size: 650
