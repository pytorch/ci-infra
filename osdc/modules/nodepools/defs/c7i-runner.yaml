# Karpenter NodePool fleet: c7i-runner — dedicated pool for the ARC runner pods (and their
# placeholders) of x86 runners. arm64 runners' runner pods use the arm64-runner pool instead, so
# the runner agent reports the same architecture as the job (runner.arch / RUNNER_ARCH).
# The node-fleet=c7i-runner taint is load-bearing: runner.yaml.tpl and hooks-warmer key on it.
fleet:
  name: c7i-runner
  arch: amd64
  gpu: false
  instances:
    - type: c7i.12xlarge
      weight: 100
      node_disk_size: 1350
    - type: c7i.8xlarge
      weight: 80
      node_disk_size: 650
    - type: m7i.12xlarge
      weight: 60
      node_disk_size: 1350
    - type: m7i.8xlarge
      weight: 40
      node_disk_size: 650
