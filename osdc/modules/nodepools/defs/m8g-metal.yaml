# Karpenter NodePool fleet: m8g-metal — dedicated pool for large m8g runners.
# Name-only subset of m8g; separation is enforced by the node-fleet=m8g-metal taint.
# Single instance type on purpose: a fallback would silently substitute a
# virtualized m8g node into a bare-metal perf benchmark.
fleet:
  name: m8g-metal
  arch: arm64
  gpu: false
  exclude_regions:
    - us-west-1
  instances:
    - type: m8g.metal-24xl
      weight: 100
      node_disk_size: 1000
      baremetal: true
