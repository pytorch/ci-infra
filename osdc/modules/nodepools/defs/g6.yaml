# NUMA note: restricted topology policy may reject mixed GPU packing; monitor for TopologyAffinityError
# Karpenter NodePool fleet: g6 (NVIDIA L4)
# GPU compute — single fleet, scheduling by nvidia.com/gpu resource requests
fleet:
  name: g6
  arch: amd64
  gpu: true
  exclude_regions:
    - us-west-1
  # LF clusters (lf-prod-aws-ue1/ue2) get a different weight ladder than the
  # authored (Meta) default: g6.48xlarge never launches there (0 successes in
  # 211 CreateFleet attempts across both clusters — COPS-461), and the
  # survivors are reordered by cost per delivered runner-hour rather than
  # left in largest-first order. See docs/current_runner_load_distribution.md
  # for the runner mix (94% 1-GPU / 6% 4-GPU) that the LF order is tuned for.
  # Release wheel-build GPU runners. Generates the g6-*-release NodePools with
  # osdc.io/runner-class: release, so the CUDA x86_64 wheel rows get a device
  # without sharing nodes with CI GPU jobs.
  # g6.8xlarge rather than g5.8xlarge: same 32c/128Gi 1-GPU shape, cheaper per
  # runner-hour, and L4 (sm_89) is in the arch list those wheels compile for.
  release:
    # Smallest node that fits, largest last. The 12xlarge earns its place at the
    # bottom as a fallthrough: release pods match only release pools, so a class
    # with nothing below its smallest size strands an oversized pod in Pending
    # forever, which is what #1079 was.
    - type: g6.4xlarge
      weight: 100
      node_disk_size: 600
      has_nvme: true
    - type: g6.8xlarge
      weight: 95
      node_disk_size: 600
      has_nvme: true
    - type: g6.12xlarge
      weight: 90
      node_disk_size: 600
      has_nvme: true

  instances:
    # Smallest node here with a GPU; a 1-GPU pod takes a whole node either way.
    # Ranked above the other 1-GPU sizes; the multi-GPU ones pack several pods.
    - type: g6.4xlarge
      weight:
        default: 75
        lf-prod-aws-ue1: 100
        lf-prod-aws-ue2: 100
      node_disk_size: 600
      has_nvme: true
    - type: g6.48xlarge
      weight:
        default: 100
        lf-prod-aws-ue1: 0    # disabled — cannot be provisioned on LF
        lf-prod-aws-ue2: 0
      node_disk_size: 600
      has_nvme: true
    - type: g6.12xlarge
      weight:
        default: 90
        lf-prod-aws-ue1: 70   # 4-GPU cost optimum ($4.60/runner-hr) — 6% of volume
        lf-prod-aws-ue2: 70
      node_disk_size: 600
      has_nvme: true
    - type: g6.24xlarge
      weight:
        default: 80
        lf-prod-aws-ue1: 90   # 1-GPU fallthrough — 3 runners/node, $2.23/runner-hr
        lf-prod-aws-ue2: 90
      node_disk_size: 600
      has_nvme: true
    - type: g6.8xlarge
      weight:
        default: 70
        lf-prod-aws-ue1: 95   # 1-GPU fallthrough for pods too big for the 4xlarge ($2.01/runner-hr)
        lf-prod-aws-ue2: 95
      node_disk_size: 600
      has_nvme: true
    - type: g6.16xlarge
      weight:
        default: 60
        lf-prod-aws-ue1: 80   # 1-GPU last resort ($3.40); cannot host a 4-GPU pod
        lf-prod-aws-ue2: 80
      node_disk_size: 600
      has_nvme: true
