# GitHub ARC Controller - Base Values (New v0.8.0+ API)
# These values are shared across all environments
# Install with: helm install arc oci://ghcr.io/jeanschmidt/actions-runner-controller-charts/gha-runner-scale-set-controller

# Controller settings
replicaCount: 2

# Controller resources — sized for 40+ AutoScalingRunnerSets at high concurrency.
# Informer caches grow linearly with active runners; Go GC doubles live heap.
# At peak (thousands of concurrent runners), cache alone can exceed 1Gi.
resources:
  limits:
    cpu: "4"
    memory: 4Gi
  requests:
    cpu: "1"
    memory: 2Gi

# Logging level (debug, info, warn, error)
log:
  level: info
  format: text

# Flags for the controller
flags:
  # Update listener pods when new runner image is available
  updateStrategy: "immediate"
  # Watch namespaces (empty = all namespaces)
  watchNamespace: ""

# Service account
serviceAccount:
  create: true
  annotations: {}

# Metrics
metrics:
  controllerManagerAddr: ":8080"
  listenerAddr: ":8080"
  listenerEndpoint: "/metrics"

# Security context
securityContext:
  runAsNonRoot: true
  runAsUser: 1000

# CRITICAL: Tolerations to run on base infrastructure nodes
# The base nodes are tainted with CriticalAddonsOnly=true:NoSchedule
tolerations:
  - key: CriticalAddonsOnly
    operator: Equal
    value: "true"
    effect: NoSchedule

# Node selector (optional - can specify if base nodes have specific labels)
nodeSelector: {}

# Hard-spread controller replicas one-per-node. Without this, a rolling base
# node replacement (nodes become Ready one at a time) can pile every replica
# onto whichever node comes up first, starving other pods on that node of
# CPU. maxUnavailable on the base node group never exceeds replicas-1 nodes,
# so DoNotSchedule can't wedge this pending.
#
# matchLabelKeys: [pod-template-hash] scopes the skew calculation to the
# current ReplicaSet generation only, so a Deployment rollout doesn't count
# old-generation pods still awaiting termination against new pods'
# placement — replicaCount currently sits under node count so this hasn't
# deadlocked yet, but see base/helm/harbor/values.yaml for the rollout
# deadlock this avoids once that margin disappears.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: gha-rs-controller
        app.kubernetes.io/instance: arc
    matchLabelKeys:
      - pod-template-hash
