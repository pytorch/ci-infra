apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: harbor-cache-recovery-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: osdc-monitoring
spec:
  groups:
    - name: harbor-cache-recovery
      rules:
        # The recovery CronJob runs every 5 minutes and deletes individual
        # artifacts whose cached content is corrupt from Harbor's pull-through
        # proxy caches. That class is a small minority of image pull failures —
        # when the job stops working, only pods hitting a corrupt artifact stay
        # in ImagePullBackOff (see osdc/modules/harbor-cache-recovery).
        #
        # Each scheduled run produces a fresh Job object — we cannot watch a
        # long-lived pod, so all alerts target the Job objects (kept by KSM via
        # the kube_job_.* allowlist in monitoring/helm/values.yaml).
        - alert: HarborCacheRecoveryFailing
          expr: |
            max(
              kube_job_status_failed{namespace="harbor-system", job_name=~"harbor-cache-recovery-.*"}
            ) > 0
          for: 15m
          labels:
            severity: critical
            team: pytorch-dev-infra
            priority: P3
          annotations:
            summary: "harbor-cache-recovery cronjob is failing"
            description: >-
              The harbor-cache-recovery CronJob has had failing runs for at least
              15 minutes (≥3 consecutive runs at the */5 schedule). Containerd
              content-corruption pull failures ("failed size validation",
              "unexpected commit digest" and similar) are no longer auto-purged
              from the Harbor proxy caches, so pods hitting one stay in
              ImagePullBackOff until that artifact is deleted by hand. Those are a
              small minority of pull failures — most are "unexpected media type",
              which this job never purges — so the alert does not by itself mean
              the fleet cannot pull images. Triage:
              kubectl -n harbor-system describe cronjob harbor-cache-recovery;
              kubectl -n harbor-system logs -l app.kubernetes.io/name=harbor-cache-recovery --tail=50

        - alert: HarborCacheRecoveryOOM
          # Faster-firing companion alert — surfaces the most common root cause
          # (script OOMKilled while listing pods cluster-wide) directly, so the
          # responder doesn't have to dig through pod descriptions.
          #
          # We use `kube_pod_container_status_terminated_reason` (no `_last_`)
          # because the recovery pods have restartPolicy=Never. KSM only emits
          # `_last_terminated_reason` after a container restart; non-restarting
          # pods only populate the current `_terminated_reason` series.
          expr: |
            max(
              kube_pod_container_status_terminated_reason{
                namespace="harbor-system",
                pod=~"harbor-cache-recovery-.*",
                reason="OOMKilled"
              }
            ) > 0
          for: 10m
          labels:
            severity: warning
            team: pytorch-dev-infra
            priority: P3
          annotations:
            summary: "harbor-cache-recovery pod was OOMKilled"
            description: >-
              The harbor-cache-recovery pod hit its memory limit while listing
              pods cluster-wide. Bump the limits in
              osdc/modules/harbor-cache-recovery/kubernetes/cronjob.yaml. Until
              that ships, delete a corrupt artifact by hand against the Harbor
              API (repo path slashes double-encoded as %252F):
              DELETE /api/v2.0/projects/<project>/repositories/<repo>/artifacts/<tag or digest>.
              Delete the single artifact, never the repository — a repository
              delete also evicts every good tag in it.

        - alert: HarborCacheRecoveryStale
          # Catches the case where the CronJob isn't running at all — suspended,
          # controller stuck, no successful Job objects produced. 1800s = 30 min,
          # i.e. 6× the */5 schedule, so this fires only after sustained absence.
          expr: |
            (time()
              - max(kube_job_status_completion_time{
                  namespace="harbor-system",
                  job_name=~"harbor-cache-recovery-.*"
                })
            ) > 1800
          for: 5m
          labels:
            severity: warning
            team: pytorch-dev-infra
            priority: P3
          annotations:
            summary: "harbor-cache-recovery has not completed successfully in >30m"
            description: >-
              No successful run of harbor-cache-recovery has been observed in the
              last 30 minutes, so corrupt Harbor proxy-cache artifacts are no
              longer auto-deleted. Only pods already stuck on such an artifact are
              affected; pull failures with any other cause neither improve nor
              worsen. Confirm the CronJob is not suspended and is still creating
              Jobs: kubectl -n harbor-system get cronjob,jobs.batch
