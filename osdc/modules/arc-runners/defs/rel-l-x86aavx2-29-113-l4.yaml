# ARC runner definition: rel-l-x86aavx2-29-113-l4
# Release wheel-build runner (x86, GPU) — dedicated runner group + node isolation.
# Instance type: g6.8xlarge — 1-GPU L4, 32c/128Gi node (pool: g6-8xlarge-release).
# Same 150Gi of ephemeral storage as the CI l-x86aavx2-29-113-l4 runner and the
# linux.g5.4xlarge.nvidia.gpu EC2 runner this replaces. Requesting the node's
# full 600 would never schedule: allocatable is below that once the AMI, images
# and kubelet reserves are taken.
# One GPU per node means one runner per node without needing bare-metal sizing.
#
# 104Gi, not the 113Gi the label says: instance_specs.py puts g6.8xlarge
# allocatable at 121241Mi, and Karpenter schedules the job plus its sidecars and
# the node's daemonsets -- ~9.8Gi more, so 113Gi demands 125790Mi and overshoots
# by 4.4Gi. The CI runners survive the same mistake because their fleet offers
# five sizes to fall through to; this one's fleet generates a single release
# nodepool (g6-8xlarge-release), so there is nothing below it and the pod simply
# stays Pending. 104Gi leaves 4.6Gi of margin. The label keeps -113- because
# renaming is a cross-repo contract change; Karpenter reads the request below.
#
# Exists for the CUDA x86_64 wheel rows, whose smoke test exports a model through
# the CUDA partitioner and runs it, so unlike the CPU release runners this one
# needs a device. L4 is sm_89, which the x86_64 rows already compile for
# (.ci/scripts/wheel/cuda_arch_list.sh: 8.0 8.6 8.9 9.0 10.0 12.0).
runner:
  name: rel-l-x86aavx2-29-113-l4
  instance_type: g6.8xlarge
  disk_size: 150
  vcpu: 29
  memory: 104Gi
  gpu: 1
  runner_class: release
  # No runner_group here: release-class runners always land in the per-region
  # group {cluster_group}-release-runners, derived by generate_runners.py from
  # the cluster config (a def-level runner_group would be ignored for them).
  proactive_capacity: 0
  hud_failure_base_capacity: 0    # release builds aren't in the HUD queue; scale on demand
  max_burst_capacity: 10
