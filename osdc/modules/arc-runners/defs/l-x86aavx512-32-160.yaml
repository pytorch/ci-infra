# ARC runner definition: l-x86aavx512-32-160
# Instance type: m8a.12xlarge (pool: m8a-12xl)
# Runs in parallel with l-x86iamx-32-128. It does not replace that AMX runner.
# The zen perf jobs in pytorch/pytorch move from l-x86aavx512-125-463 to this runner.
# l-x86aavx512-125-463 stays deployed; this change does not remove it.
# 32 vCPU is the size seen to work best in local CI runs. 160 GiB keeps the memory of the
# earlier 46-vCPU design. One pod fits on the 48 vCPU / 192 GiB node after kubelet and
# ENI max-pod reservation (758 pods).
runner:
  name: l-x86aavx512-32-160
  instance_type: m8a.12xlarge
  node_fleet: m8a-12xl
  disk_size: 200
  vcpu: 32
  memory: 160Gi
  gpu: 0
  proactive_capacity: 0
  hud_failure_base_capacity: 30
  max_burst_capacity: 250
