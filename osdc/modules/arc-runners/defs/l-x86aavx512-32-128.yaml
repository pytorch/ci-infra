# ARC runner definition: l-x86aavx512-32-128
# Instance type: m8a.12xlarge (pool: m8a-12xl)
# Replaces l-x86iamx-32-128 for the inductor jobs that move off Intel AMX.
# One pod fits on the 48 vCPU / 192 GiB node.
runner:
  name: l-x86aavx512-32-128
  instance_type: m8a.12xlarge
  node_fleet: m8a-12xl
  disk_size: 200
  vcpu: 32
  memory: 128Gi
  gpu: 0
  proactive_capacity: 0
  hud_failure_base_capacity: 30
  max_burst_capacity: 250
