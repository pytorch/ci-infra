# ARC runner definition: l-x86aavx2-11-41-l4
# Instance type: g6.4xlarge — 1-GPU L4, 16c/64Gi node (pool: g6-4xlarge).
# Largest pod that still packs GPU-bound on every size in the fleet: 1 to a
# 4xlarge, 4 to a 12xlarge, 8 to a 48xlarge. The 12xlarge sets the ceiling at
# (48000m - 1355m)/4 and (181862Mi - 10078Mi)/4, where 1355m / 10078Mi is what
# Karpenter charges on a workload node — see docs/node-utilization-optimization.md.
runner:
  name: l-x86aavx2-11-41-l4
  instance_type: g6.4xlarge
  disk_size: 150
  vcpu: 11
  memory: 41Gi
  gpu: 1
  proactive_capacity: 0
  hud_failure_base_capacity: 30
  max_burst_capacity: 60
