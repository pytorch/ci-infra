# ARC runner definition: l-x86aavx512-46-160
# Instance type: m8a.12xlarge (pool: m8a-12xl)
# Replaces l-x86aavx512-125-463 for inductor-perf-test-nightly-x86-zen.
# Those jobs do not scale to 125 cores. 46 vCPU / 160 GiB is one pod on this
# 48 vCPU / 192 GiB node after kubelet and ENI max-pod reservation (758 pods).
runner:
  name: l-x86aavx512-46-160
  instance_type: m8a.12xlarge
  node_fleet: m8a-12xl
  disk_size: 200
  vcpu: 46
  memory: 160Gi
  gpu: 0
  proactive_capacity: 0
  hud_failure_base_capacity: 15
  max_burst_capacity: 30
