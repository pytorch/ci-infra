---
- name: Restart ghad service
  hosts: all
  become: yes
  vars:
    ansible_host_key_checking: false
  module_defaults:
    shell:
      executable: /bin/bash

  tasks:
    # A missing flag means the node was intentionally taken out of
    # auto-restart (see ghad-manager.service's ConditionPathExists). Running
    # this playbook is the explicit, human-involved action that re-arms it.
    - name: Ensure ghad-manager autostart flag exists
      ansible.builtin.file:
        path: /etc/gha-runner-config/autostart-enabled
        state: touch
        mode: '0644'

    - name: Restart the runner manager service
      ansible.builtin.systemd:
        name: ghad-manager
        state: restarted
        enabled: yes
